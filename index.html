<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>toDO Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f4f4;
    color: #171717;
    font-family: Arial, Helvetica, sans-serif;
}

.app {
    width: min(1100px, 94vw);
    margin: 35px auto;
}

/* HEADER */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.logo {
    font-size: 30px;
    font-weight: 700;
}

.date {
    font-size: 16px;
    color: #555;
}

/* MAIN LAYOUT */

.main {
    display: grid;
    grid-template-columns: 1fr 1.15fr;
    gap: 18px;
}

.left {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.box {
    background: white;
    border: 1px solid #bbb;
    border-radius: 10px;
    padding: 22px;
}

/* POMODORO */

.pomodoro {
    min-height: 300px;
    text-align: center;
}

.pomodoro h2 {
    margin: 0 0 15px;
    font-size: 20px;
}

.timer {
    font-size: 64px;
    font-weight: 700;
    margin: 15px 0 8px;
    font-variant-numeric: tabular-nums;
}

.timer-mode {
    color: #666;
    margin-bottom: 15px;
}

.timer-task {
    min-height: 22px;
    color: #444;
    margin-bottom: 18px;
}

button {
    cursor: pointer;
    font-family: inherit;
}

.btn {
    background: white;
    border: 1px solid #999;
    border-radius: 6px;
    padding: 9px 18px;
    font-size: 14px;
}

.btn:hover {
    background: #f0f0f0;
}

.btn-dark {
    background: #171717;
    color: white;
    border-color: #171717;
}

.btn-dark:hover {
    background: #333;
}

.timer-buttons {
    display: flex;
    justify-content: center;
    gap: 8px;
}

/* PROGRESS */

.progress {
    min-height: 150px;
}

.progress h2 {
    margin: 0 0 18px;
    font-size: 18px;
}

.activity {
    display: grid;
    grid-template-columns: repeat(30, 1fr);
    gap: 5px;
    align-items: center;
}

.dot {
    width: 100%;
    aspect-ratio: 1;
    min-width: 8px;
    border-radius: 50%;
    border: none;
    background: #ddd;
    padding: 0;
}

.dot.level1 {
    background: #b9e6a1;
}

.dot.level2 {
    background: #79d45b;
}

.dot.level3 {
    background: #42b72c;
}

.dot.level4 {
    background: #16820a;
}

.progress-labels {
    display: flex;
    justify-content: space-between;
    color: #777;
    font-size: 12px;
    margin-top: 8px;
}

/* HISTORY */

.history {
    min-height: 170px;
}

.history h2 {
    margin: 0 0 14px;
    font-size: 18px;
}

.history-list {
    max-height: 180px;
    overflow-y: auto;
}

.history-day {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #eee;
    padding: 8px 2px;
    cursor: pointer;
}

.history-day:hover {
    background: #f7f7f7;
}

.history-day span:last-child {
    color: #777;
    font-size: 13px;
}

/* TASKS */

.tasks {
    min-height: 590px;
    display: flex;
    flex-direction: column;
}

.tasks-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 25px;
}

.tasks-header h2 {
    margin: 0;
    font-size: 20px;
}

.tasks-date {
    color: #555;
    font-size: 14px;
}

.task-list {
    flex: 1;
}

.task-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 2px;
    border-bottom: 1px solid #eee;
}

.task-number {
    width: 24px;
    color: #555;
}

.task-name {
    flex: 1;
    font-size: 16px;
}

.task-deadline {
    color: #777;
    font-size: 13px;
    margin-right: 8px;
}

.task-row.done .task-name {
    text-decoration: line-through;
    color: #888;
}

.task-row.done .task-deadline {
    color: #aaa;
}

.task-action {
    border: 1px solid #bbb;
    background: white;
    width: 27px;
    height: 27px;
    border-radius: 4px;
}

.task-action:hover {
    background: #eee;
}

.task-empty {
    color: #777;
    margin-top: 30px;
}

/* ADD TASK */

.add-task {
    margin-top: 25px;
    align-self: flex-start;
}

.add-task button {
    min-width: 130px;
}

/* MODAL */

.modal-background {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal {
    width: min(430px, 100%);
    background: white;
    border-radius: 10px;
    padding: 25px;
}

.modal h2 {
    margin-top: 0;
}

.field {
    margin-bottom: 15px;
}

.field label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
}

.field input {
    width: 100%;
    padding: 10px;
    border: 1px solid #bbb;
    border-radius: 6px;
}

.modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
}

/* HISTORY MODAL */

.history-task {
    padding: 7px 0;
    border-bottom: 1px solid #eee;
}

.history-task.done {
    color: #777;
    text-decoration: line-through;
}

/* MOBILE */

@media (max-width: 750px) {

    .app {
        width: 94vw;
        margin: 18px auto;
    }

    .main {
        grid-template-columns: 1fr;
    }

    .tasks {
        min-height: 500px;
    }

    .timer {
        min-height: 260px;
    }

    .timer {
        font-size: 52px;
    }

    .activity {
        gap: 3px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header>
        <div class="logo">toDO</div>
        <div class="date" id="currentDate"></div>
    </header>


    <div class="main">

        <!-- LEFT SIDE -->

        <div class="left">

            <!-- POMODORO -->

            <section class="box pomodoro">

                <h2>Pomodoro</h2>

                <div class="timer-mode" id="timerMode">
                    Focus
                </div>

                <div class="timer" id="timer">
                    25:00
                </div>

                <div class="timer-task" id="timerTask">
                    No task selected
                </div>

                <div class="timer-buttons">

                    <button
                        class="btn btn-dark"
                        id="startTimer">
                        Start
                    </button>

                    <button
                        class="btn"
                        id="resetTimer">
                        Reset
                    </button>

                </div>

            </section>


            <!-- PROGRESS -->

            <section class="box progress">

                <h2>Progress</h2>

                <div
                    class="activity"
                    id="activity">
                </div>

                <div class="progress-labels">
                    <span id="progressStart"></span>
                    <span>Today</span>
                </div>

            </section>


            <!-- HISTORY -->

            <section class="box history">

                <h2>History</h2>

                <div
                    class="history-list"
                    id="historyList">
                </div>

            </section>

        </div>


        <!-- RIGHT SIDE -->

        <section class="box tasks">

            <div class="tasks-header">

                <h2>Tasks for today</h2>

                <div
                    class="tasks-date"
                    id="tasksDate">
                </div>

            </div>


            <div
                class="task-list"
                id="taskList">
            </div>


            <div class="add-task">

                <button
                    class="btn btn-dark"
                    id="openAddTask">
                    Add task
                </button>

            </div>

        </section>

    </div>

</div>


<!-- ADD TASK MODAL -->

<div
    class="modal-background"
    id="addModal">

    <div class="modal">

        <h2>Add task</h2>

        <div class="field">

            <label for="taskName">
                Task
            </label>

            <input
                id="taskName"
                type="text"
                placeholder="What do you need to do?">

        </div>


        <div class="field">

            <label for="taskDeadline">
                Deadline
            </label>

            <input
                id="taskDeadline"
                type="datetime-local">

        </div>


        <div class="modal-buttons">

            <button
                class="btn"
                id="cancelAdd">
                Cancel
            </button>

            <button
                class="btn btn-dark"
                id="saveTask">
                Add task
            </button>

        </div>

    </div>

</div>


<!-- HISTORY MODAL -->

<div
    class="modal-background"
    id="historyModal">

    <div class="modal">

        <h2 id="historyTitle"></h2>

        <div id="historyTasks"></div>

        <div class="modal-buttons">

            <button
                class="btn"
                id="closeHistory">
                Close
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   DATA
========================================================= */

const STORAGE_KEY = "todo_dashboard_v2";

let data = JSON.parse(
    localStorage.getItem(STORAGE_KEY)
    || '{"tasks":[],"pomodoros":[]}'
);

function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}


/* =========================================================
   DATE HELPERS
========================================================= */

function dateKey(date = new Date()) {

    const year = date.getFullYear();

    const month = String(
        date.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
        date.getDate()
    ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function formatDate(date) {

    return date.toLocaleDateString(
        undefined,
        {
            day: "numeric",
            month: "short",
            year: "numeric"
        }
    );
}


function formatTime(date) {

    return date.toLocaleTimeString(
        undefined,
        {
            hour: "numeric",
            minute: "2-digit"
        }
    );
}


/* =========================================================
   HEADER
========================================================= */

function renderDates() {

    const today = new Date();

    document.getElementById(
        "currentDate"
    ).textContent = today.toLocaleDateString(
        undefined,
        {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

    document.getElementById(
        "tasksDate"
    ).textContent = today.toLocaleDateString(
        undefined,
        {
            day: "numeric",
            month: "short",
            year: "numeric"
        }
    );
}


/* =========================================================
   TASKS
========================================================= */

function renderTasks() {

    const list =
        document.getElementById("taskList");

    const today = dateKey();

    const tasks = data.tasks
        .filter(task =>
            task.createdDate === today
        )
        .sort(
            (a, b) =>
                new Date(a.deadline)
                -
                new Date(b.deadline)
        );

    if (tasks.length === 0) {

        list.innerHTML =
            '<div class="task-empty">No tasks today.</div>';

        return;
    }

    list.innerHTML = "";

    tasks.forEach(
        (task, index) => {

            const row =
                document.createElement("div");

            row.className =
                "task-row"
                + (task.done ? " done" : "");

            const number =
                document.createElement("div");

            number.className =
                "task-number";

            number.textContent =
                `${index + 1}.`;

            const name =
                document.createElement("div");

            name.className =
                "task-name";

            name.textContent =
                task.title;

            const deadline =
                document.createElement("div");

            deadline.className =
                "task-deadline";

            deadline.textContent =
                formatTime(
                    new Date(task.deadline)
                );

            const complete =
                document.createElement("button");

            complete.className =
                "task-action";

            complete.textContent =
                task.done ? "↶" : "✓";

            complete.title =
                task.done
                ? "Undo"
                : "Complete";

            complete.onclick =
                () => toggleTask(task.id);

            const timerButton =
                document.createElement("button");

            timerButton.className =
                "task-action";

            timerButton.textContent =
                "T";

            timerButton.title =
                "Use this task for Pomodoro";

            timerButton.onclick =
                () => selectTimerTask(task.id);

            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "task-action";

            deleteButton.textContent =
                "×";

            deleteButton.title =
                "Delete";

            deleteButton.onclick =
                () => deleteTask(task.id);

            row.appendChild(number);
            row.appendChild(name);
            row.appendChild(deadline);
            row.appendChild(complete);
            row.appendChild(timerButton);
            row.appendChild(deleteButton);

            list.appendChild(row);
        }
    );
}


function toggleTask(id) {

    const task =
        data.tasks.find(
            task => task.id === id
        );

    if (!task) return;

    task.done = !task.done;

    if (task.done) {

        task.completedAt =
            new Date().toISOString();

    } else {

        task.completedAt = null;
    }

    saveData();

    renderAll();
}


function deleteTask(id) {

    data.tasks =
        data.tasks.filter(
            task => task.id !== id
        );

    saveData();

    renderAll();
}


/* =========================================================
   ADD TASK
========================================================= */

const addModal =
    document.getElementById("addModal");


document.getElementById(
    "openAddTask"
).onclick = () => {

    addModal.style.display = "flex";

    document.getElementById(
        "taskName"
    ).focus();
};


document.getElementById(
    "cancelAdd"
).onclick = () => {

    addModal.style.display = "none";
};


document.getElementById(
    "saveTask"
).onclick = addTask;


document.getElementById(
    "taskName"
).addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            addTask();
        }
    }
);


function addTask() {

    const name =
        document.getElementById(
            "taskName"
        ).value.trim();

    const deadlineInput =
        document.getElementById(
            "taskDeadline"
        ).value;

    if (!name) {

        alert("Enter a task.");

        return;
    }

    let deadline;

    if (deadlineInput) {

        deadline =
            new Date(deadlineInput);

    } else {

        deadline =
            new Date(
                Date.now()
                + 60 * 60 * 1000
            );
    }

    const task = {

        id:
            Date.now().toString(),

        title:
            name,

        deadline:
            deadline.toISOString(),

        createdDate:
            dateKey(),

        done:
            false,

        completedAt:
            null
    };

    data.tasks.push(task);

    saveData();

    document.getElementById(
        "taskName"
    ).value = "";

    document.getElementById(
        "taskDeadline"
    ).value = "";

    addModal.style.display = "none";

    renderAll();
}


/* =========================================================
   POMODORO
========================================================= */

let timerSeconds = 25 * 60;

let timerRunning = false;

let timerInterval = null;

let timerMode = "focus";

let selectedTaskId = null;


function updateTimerDisplay() {

    const minutes =
        Math.floor(timerSeconds / 60);

    const seconds =
        timerSeconds % 60;

    document.getElementById(
        "timer"
    ).textContent =
        `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

    document.getElementById(
        "timerMode"
    ).textContent =
        timerMode === "focus"
        ? "Focus"
        : "Break";

    const task =
        data.tasks.find(
            task => task.id === selectedTaskId
        );

    document.getElementById(
        "timerTask"
    ).textContent =
        task
        ? task.title
        : "No task selected";

    document.getElementById(
        "startTimer"
    ).textContent =
        timerRunning
        ? "Pause"
        : "Start";
}


function selectTimerTask(id) {

    selectedTaskId = id;

    updateTimerDisplay();
}


document.getElementById(
    "startTimer"
).onclick = () => {

    if (timerRunning) {

        clearInterval(timerInterval);

        timerRunning = false;

        updateTimerDisplay();

        return;
    }

    timerRunning = true;

    timerInterval =
        setInterval(
            timerTick,
            1000
        );

    updateTimerDisplay();
};


function timerTick() {

    timerSeconds--;

    if (timerSeconds <= 0) {

        clearInterval(timerInterval);

        timerRunning = false;

        if (timerMode === "focus") {

            data.pomodoros.push({

                date: dateKey(),

                taskId:
                    selectedTaskId,

                completedAt:
                    new Date().toISOString(),

                minutes: 25
            });

            saveData();

            timerMode = "break";

            timerSeconds =
                5 * 60;

        } else {

            timerMode = "focus";

            timerSeconds =
                25 * 60;
        }

        alert(
            timerMode === "break"
            ? "Focus session complete."
            : "Break complete."
        );
    }

    updateTimerDisplay();
}


document.getElementById(
    "resetTimer"
).onclick = () => {

    clearInterval(timerInterval);

    timerRunning = false;

    timerMode = "focus";

    timerSeconds =
        25 * 60;

    updateTimerDisplay();
};


/* =========================================================
   PROGRESS
========================================================= */

function renderProgress() {

    const activity =
        document.getElementById(
            "activity"
        );

    activity.innerHTML = "";

    const today =
        new Date();

    for (
        let i = 29;
        i >= 0;
        i--
    ) {

        const day =
            new Date(today);

        day.setHours(
            0, 0, 0, 0
        );

        day.setDate(
            day.getDate() - i
        );

        const key =
            dateKey(day);

        const completed =
            data.tasks.filter(
                task =>
                    task.completedAt
                    &&
                    dateKey(
                        new Date(
                            task.completedAt
                        )
                    ) === key
            ).length;

        let level = 0;

        if (completed >= 6)
            level = 4;

        else if (completed >= 4)
            level = 3;

        else if (completed >= 2)
            level = 2;

        else if (completed >= 1)
            level = 1;

        const dot =
            document.createElement(
                "button"
            );

        dot.className =
            "dot";

        if (level > 0)
            dot.classList.add(
                `level${level}`
            );

        dot.title =
            `${formatDate(day)}: ${completed} completed`;

        dot.onclick =
            () => openHistoryForDate(key);

        activity.appendChild(dot);

        if (i === 29) {

            document.getElementById(
                "progressStart"
            ).textContent =
                day.toLocaleDateString(
                    undefined,
                    {
                        month: "short",
                        day: "numeric"
                    }
                );
        }
    }
}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory() {

    const list =
        document.getElementById(
            "historyList"
        );

    const dates = [
        ...new Set(
            data.tasks.map(
                task => task.createdDate
            )
        )
    ].sort().reverse();

    if (dates.length === 0) {

        list.innerHTML =
            '<div style="color:#777">No history yet.</div>';

        return;
    }

    list.innerHTML = "";

    dates.forEach(
        key => {

            const tasks =
                data.tasks.filter(
                    task =>
                        task.createdDate === key
                );

            const completed =
                tasks.filter(
                    task => task.done
                ).length;

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "history-day";

            const date =
                new Date(
                    key + "T12:00:00"
                );

            row.innerHTML =
                `<span>${formatDate(date)}</span>
                 <span>${completed}/${tasks.length} completed</span>`;

            row.onclick =
                () => openHistoryForDate(key);

            list.appendChild(row);
        }
    );
}


const historyModal =
    document.getElementById(
        "historyModal"
    );


function openHistoryForDate(key) {

    const tasks =
        data.tasks.filter(
            task =>
                task.createdDate === key
        );

    if (!tasks.length)
        return;

    const date =
        new Date(
            key + "T12:00:00"
        );

    document.getElementById(
        "historyTitle"
    ).textContent =
        formatDate(date);

    const container =
        document.getElementById(
            "historyTasks"
        );

    container.innerHTML = "";

    tasks.forEach(
        task => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "history-task"
                + (task.done ? " done" : "");

            item.textContent =
                task.title;

            container.appendChild(item);
        }
    );

    historyModal.style.display =
        "flex";
}


document.getElementById(
    "closeHistory"
).onclick = () => {

    historyModal.style.display =
        "none";
};


/* =========================================================
   RENDER
========================================================= */

function renderAll() {

    renderDates();

    renderTasks();

    renderProgress();

    renderHistory();

    updateTimerDisplay();
}


renderAll();


/* Update countdowns periodically */

setInterval(
    renderTasks,
    30000
);

</script>

</body>
</html>
