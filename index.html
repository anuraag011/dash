<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>toDO</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f7f7f7;
    color: #111;
    font-family: Arial, Helvetica, sans-serif;
}

.app {
    max-width: 1060px;
    margin: 0 auto;
    padding: 48px 24px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
}

.logo {
    font-size: 30px;
    font-weight: 700;
}

.date {
    font-size: 17px;
    color: #444;
}

.layout {
    display: grid;
    grid-template-columns: 1fr 1.35fr;
    gap: 20px;
}

.left {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.box {
    background: white;
    border: 1px solid #c9c9c9;
    border-radius: 12px;
}

.pomodoro {
    min-height: 345px;
    padding: 26px;
    text-align: center;
}

.pomodoro h2 {
    margin: 0 0 18px;
    font-size: 24px;
}

.mode {
    color: #666;
    font-size: 18px;
    margin-bottom: 22px;
}

.timer {
    font-size: 68px;
    font-weight: 600;
    letter-spacing: -2px;
    margin-bottom: 16px;
}

.selected-task {
    color: #333;
    min-height: 22px;
    margin-bottom: 22px;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
}

button {
    border: 1px solid #aaa;
    background: white;
    color: #111;
    border-radius: 7px;
    padding: 10px 20px;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #f1f1f1;
}

.primary {
    background: #111;
    color: white;
    border-color: #111;
}

.primary:hover {
    background: #2b2b2b;
}

.settings-button {
    margin-top: 18px;
    border: none;
    padding: 8px 12px;
    color: #555;
}

.session-info {
    margin-top: 20px;
    text-align: left;
    font-size: 14px;
    color: #555;
    max-height: 80px;
    overflow-y: auto;
}

.session-info div {
    margin: 5px 0;
}

.progress-box {
    min-height: 170px;
    padding: 26px;
}

.progress-dots {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #111;
}

.dot.green {
    background: #2baa45;
}

.average-text {
    margin-top: 18px;
    font-size: 13px;
    color: #666;
}

.graph-button {
    margin-top: 18px;
}

.history {
    min-height: 190px;
    padding: 26px;
}

.history h2 {
    margin: 0 0 18px;
    font-size: 21px;
}

.history-row {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid #eee;
    font-size: 14px;
}

.tasks {
    min-height: 595px;
    padding: 26px;
    display: flex;
    flex-direction: column;
}

.tasks h2 {
    margin: 0 0 24px;
    font-size: 24px;
}

.task-list {
    flex: 1;
}

.empty {
    color: #777;
    margin-top: 20px;
}

.task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
}

.task-name {
    flex: 1;
    min-width: 0;
    font-size: 16px;
}

.task.completed .task-name {
    text-decoration: line-through;
    color: #888;
}

.deadline {
    font-size: 13px;
    color: #777;
    white-space: nowrap;
}

.task-actions {
    display: flex;
    gap: 5px;
}

.small-button {
    padding: 6px 9px;
    font-size: 13px;
}

.add-task {
    align-self: flex-start;
    margin-top: 20px;
    min-width: 150px;
}

/* MODALS */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal.open {
    display: flex;
}

.modal-content {
    width: 100%;
    max-width: 430px;
    background: white;
    border-radius: 12px;
    padding: 28px;
}

.modal-content h2 {
    margin-top: 0;
    margin-bottom: 24px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
}

input,
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #aaa;
    border-radius: 6px;
    font-size: 15px;
}

.modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 22px;
}

.settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

@media (max-width: 750px) {
    .app {
        padding: 25px 15px;
    }

    .topbar {
        align-items: flex-start;
        gap: 15px;
    }

    .date {
        font-size: 14px;
        text-align: right;
    }

    .layout {
        grid-template-columns: 1fr;
    }

    .tasks {
        min-height: 500px;
    }

    .timer {
        font-size: 56px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="topbar">
        <div class="logo">toDO</div>
        <div class="date" id="currentDate"></div>
    </div>

    <div class="layout">

        <div class="left">

            <!-- POMODORO -->
            <div class="box pomodoro">

                <h2>Pomodoro</h2>

                <div class="mode" id="mode">Focus</div>

                <div class="timer" id="timer">25:00</div>

                <div class="selected-task" id="selectedTask">
                    No task selected
                </div>

                <div class="controls">
                    <button class="primary" id="startPause">Start</button>
                    <button id="reset">Reset</button>
                </div>

                <button class="settings-button" id="openSettings">
                    Session settings
                </button>

                <div class="session-info" id="sessionInfo"></div>

            </div>


            <!-- PROGRESS -->
            <div class="box progress-box">

                <div class="progress-dots" id="progressDots"></div>

                <div class="average-text" id="averageText"></div>

                <button class="graph-button" id="openGraph">
                    Progress graph
                </button>

            </div>


            <!-- HISTORY -->
            <div class="box history">

                <h2>History</h2>

                <div id="historyList">
                    <div class="empty">No history yet.</div>
                </div>

            </div>

        </div>


        <!-- TASKS -->
        <div class="box tasks">

            <h2>Tasks for today</h2>

            <div class="task-list" id="taskList"></div>

            <button class="primary add-task" id="openTaskModal">
                Add task
            </button>

        </div>

    </div>

</div>


<!-- ADD TASK MODAL -->

<div class="modal" id="taskModal">

    <div class="modal-content">

        <h2>Add task</h2>

        <form id="taskForm">

            <div class="form-group">
                <label for="taskName">Task</label>
                <input id="taskName" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="taskDeadline">Deadline</label>
                <input id="taskDeadline" type="datetime-local">
            </div>

            <div class="modal-buttons">
                <button type="button" id="cancelTask">Cancel</button>
                <button class="primary" type="submit">Add task</button>
            </div>

        </form>

    </div>

</div>


<!-- SESSION SETTINGS MODAL -->

<div class="modal" id="settingsModal">

    <div class="modal-content">

        <h2>Session settings</h2>

        <form id="settingsForm">

            <div class="settings-grid">

                <div class="form-group">
                    <label for="focusMinutes">
                        Focus minutes
                    </label>
                    <input
                        id="focusMinutes"
                        type="number"
                        min="1"
                        max="180"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="breakMinutes">
                        Break minutes
                    </label>
                    <input
                        id="breakMinutes"
                        type="number"
                        min="1"
                        max="60"
                        required
                    >
                </div>

            </div>

            <div class="modal-buttons">
                <button type="button" id="cancelSettings">
                    Cancel
                </button>

                <button class="primary" type="submit">
                    Save
                </button>
            </div>

        </form>

    </div>

</div>


<script>

const STORAGE_KEY = "todo_dashboard_v3";

const today = () => {
    const d = new Date();
    return d.toISOString().slice(0, 10);
};

const formatDate = dateString => {
    const [y, m, d] = dateString.split("-").map(Number);

    return new Date(y, m - 1, d).toLocaleDateString(
        undefined,
        {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
        }
    );
};

const formatShortDate = dateString => {
    const [y, m, d] = dateString.split("-").map(Number);

    return new Date(y, m - 1, d).toLocaleDateString(
        undefined,
        {
            month: "short",
            day: "numeric"
        }
    );
};


/* ---------------- DATA ---------------- */

let data = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "null"
);

if (!data) {
    data = {
        tasks: [],
        sessions: [],
        settings: {
            focus: 25,
            break: 5
        }
    };
}

if (!data.settings) {
    data.settings = {
        focus: 25,
        break: 5
    };
}

if (!data.sessions) {
    data.sessions = [];
}

if (!data.tasks) {
    data.tasks = [];
}

function save() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}


/* ---------------- DATE ---------------- */

document.getElementById("currentDate").textContent =
    formatDate(today());


/* ---------------- TASKS ---------------- */

function renderTasks() {

    const list = document.getElementById("taskList");

    list.innerHTML = "";

    const todaysTasks = data.tasks.filter(
        task => task.date === today()
    );

    if (todaysTasks.length === 0) {

        list.innerHTML =
            '<div class="empty">No tasks today.</div>';

        return;
    }

    todaysTasks.forEach(task => {

        const row = document.createElement("div");

        row.className =
            "task" + (task.completed ? " completed" : "");

        const name = document.createElement("div");

        name.className = "task-name";
        name.textContent = task.name;

        const deadline = document.createElement("div");

        deadline.className = "deadline";

        if (task.deadline) {

            const date = new Date(task.deadline);

            deadline.textContent =
                date.toLocaleTimeString(
                    [],
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );
        }

        const actions =
            document.createElement("div");

        actions.className = "task-actions";


        /* COMPLETE */

        const complete =
            document.createElement("button");

        complete.className = "small-button";

        complete.textContent =
            task.completed ? "Undo" : "Done";

        complete.addEventListener(
            "click",
            () => {

                task.completed =
                    !task.completed;

                if (task.completed) {
                    task.completedAt =
                        new Date().toISOString();
                } else {
                    task.completedAt = null;
                }

                save();
                renderTasks();
            }
        );


        /* POMODORO */

        const pomo =
            document.createElement("button");

        pomo.className = "small-button";
        pomo.textContent = "T";

        pomo.title = "Use this task for Pomodoro";

        pomo.addEventListener(
            "click",
            () => {

                selectedTask = task;

                document.getElementById(
                    "selectedTask"
                ).textContent = task.name;
            }
        );


        /* DELETE */

        const del =
            document.createElement("button");

        del.className = "small-button";
        del.textContent = "Delete";

        del.addEventListener(
            "click",
            () => {

                data.tasks =
                    data.tasks.filter(
                        x => x.id !== task.id
                    );

                if (
                    selectedTask &&
                    selectedTask.id === task.id
                ) {
                    selectedTask = null;

                    document.getElementById(
                        "selectedTask"
                    ).textContent =
                        "No task selected";
                }

                save();
                renderTasks();
                renderHistory();
            }
        );


        actions.append(
            complete,
            pomo,
            del
        );

        row.append(
            name,
            deadline,
            actions
        );

        list.appendChild(row);
    });
}


/* ADD TASK */

document.getElementById(
    "openTaskModal"
).addEventListener(
    "click",
    () => {

        document.getElementById(
            "taskModal"
        ).classList.add("open");

        document.getElementById(
            "taskName"
        ).focus();
    }
);


document.getElementById(
    "cancelTask"
).addEventListener(
    "click",
    () => {

        document.getElementById(
            "taskModal"
        ).classList.remove("open");
    }
);


document.getElementById(
    "taskForm"
).addEventListener(
    "submit",
    e => {

        e.preventDefault();

        const name =
            document.getElementById(
                "taskName"
            ).value.trim();

        const deadline =
            document.getElementById(
                "taskDeadline"
            ).value;

        if (!name) return;

        data.tasks.push({
            id: Date.now().toString(),
            name,
            date: today(),
            deadline: deadline || null,
            completed: false,
            completedAt: null
        });

        save();

        e.target.reset();

        document.getElementById(
            "taskModal"
        ).classList.remove("open");

        renderTasks();
        renderHistory();
    }
);


/* ---------------- POMODORO ---------------- */

let mode = "focus";
let running = false;
let selectedTask = null;
let remainingSeconds =
    data.settings.focus * 60;

let interval = null;

let currentSessionPauses = 0;
let sessionNumber = 1;


function updateTimer() {

    const minutes =
        Math.floor(remainingSeconds / 60);

    const seconds =
        remainingSeconds % 60;

    document.getElementById(
        "timer"
    ).textContent =
        String(minutes).padStart(2, "0")
        + ":"
        + String(seconds).padStart(2, "0");
}


function startTimer() {

    if (running) return;

    running = true;

    document.getElementById(
        "startPause"
    ).textContent = "Pause";

    interval = setInterval(
        () => {

            remainingSeconds--;

            updateTimer();

            if (remainingSeconds <= 0) {

                clearInterval(interval);

                running = false;

                document.getElementById(
                    "startPause"
                ).textContent = "Start";

                finishTimer();
            }

        },
        1000
    );
}


function pauseTimer() {

    if (!running) return;

    clearInterval(interval);

    running = false;

    currentSessionPauses++;

    document.getElementById(
        "startPause"
    ).textContent = "Start";

    renderSessionInfo();
}


function finishTimer() {

    if (mode === "focus") {

        /* A completed focus session */

        data.sessions.push({
            id: Date.now().toString(),
            date: today(),
            completedAt: new Date().toISOString(),
            taskId:
                selectedTask
                    ? selectedTask.id
                    : null,
            pauses: currentSessionPauses
        });

        save();

        currentSessionPauses = 0;

        sessionNumber++;

        mode = "break";

        remainingSeconds =
            data.settings.break;

        document.getElementById(
            "mode"
        ).textContent = "Break";

        renderProgress();
        renderSessionInfo();

    } else {

        mode = "focus";

        remainingSeconds =
            data.settings.focus;

        document.getElementById(
            "mode"
        ).textContent = "Focus";
    }

    updateTimer();
}


document.getElementById(
    "startPause"
).addEventListener(
    "click",
    () => {

        if (running) {
            pauseTimer();
        } else {
            startTimer();
        }
    }
);


document.getElementById(
    "reset"
).addEventListener(
    "click",
    () => {

        clearInterval(interval);

        running = false;

        mode = "focus";

        remainingSeconds =
            data.settings.focus * 60;

        currentSessionPauses = 0;

        document.getElementById(
            "mode"
        ).textContent = "Focus";

        document.getElementById(
            "startPause"
        ).textContent = "Start";

        updateTimer();
        renderSessionInfo();
    }
);


/* ---------------- SESSION INFO ---------------- */

function renderSessionInfo() {

    const box =
        document.getElementById(
            "sessionInfo"
        );

    const sessions =
        data.sessions.filter(
            s => s.date === today()
        );

    if (sessions.length === 0) {

        box.innerHTML =
            "Today's completed sessions: 0";

        return;
    }

    box.innerHTML =
        `<div><strong>Today's sessions:</strong> ${sessions.length}</div>`
        +
        sessions
            .map(
                (s, i) =>
                    `<div>Session ${i + 1} — ${s.pauses} pauses</div>`
            )
            .join("");
}


/* ---------------- SETTINGS ---------------- */

document.getElementById(
    "openSettings"
).addEventListener(
    "click",
    () => {

        document.getElementById(
            "focusMinutes"
        ).value =
            data.settings.focus;

        document.getElementById(
            "breakMinutes"
        ).value =
            data.settings.break;

        document.getElementById(
            "settingsModal"
        ).classList.add("open");
    }
);


document.getElementById(
    "cancelSettings"
).addEventListener(
    "click",
    () => {

        document.getElementById(
            "settingsModal"
        ).classList.remove("open");
    }
);


document.getElementById(
    "settingsForm"
).addEventListener(
    "submit",
    e => {

        e.preventDefault();

        const focus =
            Number(
                document.getElementById(
                    "focusMinutes"
                ).value
            );

        const breakTime =
            Number(
                document.getElementById(
                    "breakMinutes"
                ).value
            );

        if (
            !Number.isFinite(focus) ||
            !Number.isFinite(breakTime) ||
            focus < 1 ||
            breakTime < 1
        ) {
            return;
        }

        data.settings.focus = focus;
        data.settings.break = breakTime;

        save();

        clearInterval(interval);

        running = false;
        mode = "focus";

        remainingSeconds =
            focus * 60;

        document.getElementById(
            "mode"
        ).textContent = "Focus";

        document.getElementById(
            "startPause"
        ).textContent = "Start";

        document.getElementById(
            "settingsModal"
        ).classList.remove("open");

        updateTimer();
    }
);


/* ---------------- PROGRESS DOTS ---------------- */

/*
    Historical average is calculated from completed
    focus sessions on previous days.

    Example:

    Monday: 4 sessions
    Tuesday: 6 sessions
    Wednesday: 5 sessions

    Average = 5 sessions/day

    If today reaches 5 sessions,
    all dots become green.
*/

function getAverageSessions() {

    const yesterdaySessions = {};

    data.sessions.forEach(session => {

        if (session.date === today()) return;

        if (!yesterdaySessions[session.date]) {
            yesterdaySessions[session.date] = 0;
        }

        yesterdaySessions[session.date]++;
    });

    const values =
        Object.values(yesterdaySessions);

    if (values.length === 0) {
        return 0;
    }

    return values.reduce(
        (a, b) => a + b,
        0
    ) / values.length;
}


function renderProgress() {

    const container =
        document.getElementById(
            "progressDots"
        );

    container.innerHTML = "";

    const average =
        getAverageSessions();

    const completedToday =
        data.sessions.filter(
            s => s.date === today()
        ).length;

    /*
        No historical data yet:
        dots remain black.
    */

    const threshold =
        Math.max(
            1,
            Math.ceil(average)
        );

    const reached =
        average > 0 &&
        completedToday >= threshold;

    /*
        10 simple dots.
        They are all black until today's
        session count reaches the normal average.
    */

    for (let i = 0; i < 10; i++) {

        const dot =
            document.createElement("div");

        dot.className =
            "dot" +
            (reached ? " green" : "");

        container.appendChild(dot);
    }

    const text =
        document.getElementById(
            "averageText"
        );

    if (average === 0) {

        text.textContent =
            "Complete sessions on a few days to establish your average.";

    } else {

        text.textContent =
            `${completedToday} / ${threshold} sessions today`;
    }
}


/* ---------------- HISTORY ---------------- */

function renderHistory() {

    const box =
        document.getElementById(
            "historyList"
        );

    const dates = [
        ...new Set(
            data.sessions.map(
                s => s.date
            )
        )
    ].sort().reverse();

    if (dates.length === 0) {

        box.innerHTML =
            '<div class="empty">No history yet.</div>';

        return;
    }

    box.innerHTML = "";

    dates.slice(0, 5).forEach(date => {

        const count =
            data.sessions.filter(
                s => s.date === date
            ).length;

        const row =
            document.createElement("div");

        row.className = "history-row";

        row.innerHTML =
            `<span>${formatShortDate(date)}</span>`
            +
            `<span>${count} session${count === 1 ? "" : "s"}</span>`;

        box.appendChild(row);
    });
}


/* ---------------- GRAPH BUTTON ---------------- */

document.getElementById(
    "openGraph"
).addEventListener(
    "click",
    () => {

        window.location.href =
            "graph.html";
    }
);


/* ---------------- INITIALIZE ---------------- */

renderTasks();
renderProgress();
renderHistory();
renderSessionInfo();
updateTimer();

</script>

</body>
</html>
