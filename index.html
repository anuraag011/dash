<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>toDO</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: Arial, Helvetica, sans-serif;
}

button {
    border: 1px solid #444;
    background: #222;
    color: #eee;
    border-radius: 7px;
    padding: 10px 20px;
    font-size: 15px;
    cursor: pointer;
}

button:hover { background: #2c2c2c; }

.primary {
    background: #eee;
    color: #111;
    border-color: #eee;
}

.primary:hover { background: #fff; }

input {
    width: 100%;
    padding: 11px;
    border: 1px solid #444;
    background: #111;
    color: #eee;
    border-radius: 6px;
    font-size: 15px;
}

input:focus { outline: 1px solid #777; }

/* AUTH */

.auth-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.auth-box {
    width: 100%;
    max-width: 400px;
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 32px;
}

.auth-logo {
    font-size: 30px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 28px;
}

.auth-box h2 {
    margin: 0 0 22px;
    color: #fff;
}

.form-group { margin-bottom: 18px; }

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    color: #ccc;
}

.auth-buttons {
    display: flex;
    gap: 8px;
    margin-top: 22px;
}

.auth-message {
    min-height: 20px;
    margin-top: 16px;
    font-size: 14px;
    color: #aaa;
}

/* APP */

.app {
    max-width: 1060px;
    margin: 0 auto;
    padding: 48px 24px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
}

.logo {
    font-size: 30px;
    font-weight: 700;
    color: #fff;
}

.topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
}

.date {
    font-size: 17px;
    color: #aaa;
}

.logout-button {
    padding: 7px 11px;
    font-size: 13px;
}

.layout {
    display: grid;
    grid-template-columns: 1fr 1.35fr;
    gap: 20px;
}

.left {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.box {
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 12px;
}

/* POMODORO */

.pomodoro {
    min-height: 345px;
    padding: 26px;
    text-align: center;
}

.pomodoro h2 {
    margin: 0 0 18px;
    font-size: 24px;
    color: #fff;
}

.mode {
    color: #999;
    font-size: 18px;
    margin-bottom: 22px;
}

.timer {
    font-size: 68px;
    font-weight: 600;
    letter-spacing: -2px;
    margin-bottom: 16px;
    color: #fff;
}

.selected-task {
    color: #ccc;
    min-height: 22px;
    margin-bottom: 22px;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
}

.settings-button {
    margin-top: 18px;
    border: none;
    padding: 8px 12px;
    color: #aaa;
    background: transparent;
}

.settings-button:hover {
    background: #222;
    color: #eee;
}

.session-info {
    margin-top: 20px;
    text-align: left;
    font-size: 14px;
    color: #999;
    max-height: 85px;
    overflow-y: auto;
}

.session-info div { margin: 5px 0; }

/* PROGRESS */

.progress-box {
    min-height: 170px;
    padding: 26px;
}

.progress-dots {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 14px;
    align-items: center;
}

.dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #eee;
    justify-self: center;
}

.dot.green { background: #2baa45; }
.dot.red { background: #d93636; }
.dot.future { background: #eee; }

.progress-label {
    margin-top: 16px;
    font-size: 13px;
    color: #888;
}

.graph-button { margin-top: 16px; }

/* TASKS */

.tasks {
    min-height: 535px;
    padding: 26px;
    display: flex;
    flex-direction: column;
}

.tasks h2 {
    margin: 0 0 24px;
    font-size: 24px;
    color: #fff;
}

.task-list { flex: 1; }

.empty {
    color: #777;
    margin-top: 20px;
}

.task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid #292929;
}

.task-name {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    color: #eee;
}

.task.completed .task-name {
    text-decoration: line-through;
    color: #666;
}

.deadline {
    font-size: 13px;
    color: #888;
    white-space: nowrap;
}

.task-actions {
    display: flex;
    gap: 5px;
}

.small-button {
    padding: 6px 9px;
    font-size: 13px;
}

.add-task {
    align-self: flex-start;
    margin-top: 20px;
    min-width: 150px;
}

/* MODALS */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal.open {
    display: flex;
}

.modal-content {
    width: 100%;
    max-width: 430px;
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 28px;
}

.modal-content h2 {
    margin-top: 0;
    margin-bottom: 24px;
    color: #fff;
}

.modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 22px;
}

.settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

@media (max-width: 750px) {
    .app { padding: 25px 15px; }

    .topbar {
        align-items: flex-start;
        gap: 15px;
    }

    .topbar-right {
        align-items: flex-end;
        flex-direction: column;
        gap: 8px;
    }

    .date {
        font-size: 14px;
        text-align: right;
    }

    .layout { grid-template-columns: 1fr; }

    .tasks { min-height: 500px; }

    .timer { font-size: 56px; }
}
</style>
</head>

<body>

<!-- AUTH SCREEN -->
<div class="auth-screen" id="authScreen">
    <div class="auth-box">
        <div class="auth-logo">toDO</div>

        <h2 id="authTitle">Log in</h2>

        <form id="authForm">
            <div class="form-group">
                <label for="authEmail">Email</label>
                <input id="authEmail" type="email" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="authPassword">Password</label>
                <input id="authPassword" type="password" required minlength="6" autocomplete="current-password">
            </div>

            <div class="auth-buttons">
                <button class="primary" type="submit" id="authSubmit">Log in</button>
                <button type="button" id="toggleAuth">Create account</button>
            </div>
        </form>

        <div class="auth-message" id="authMessage"></div>
    </div>
</div>

<!-- APP -->
<div class="app" id="app" style="display:none;">

    <div class="topbar">
        <div class="logo">toDO</div>

        <div class="topbar-right">
            <div class="date" id="currentDate"></div>
            <button class="logout-button" id="logout">Log out</button>
        </div>
    </div>

    <div class="layout">

        <div class="left">

            <div class="box pomodoro">
                <h2>Pomodoro</h2>

                <div class="mode" id="mode">Focus</div>

                <div class="timer" id="timer">25:00</div>

                <div class="selected-task" id="selectedTask">
                    No task selected
                </div>

                <div class="controls">
                    <button class="primary" id="startPause">Start</button>
                    <button id="reset">Reset</button>
                </div>

                <button class="settings-button" id="openSettings">
                    Session settings
                </button>

                <div class="session-info" id="sessionInfo"></div>
            </div>

            <div class="box progress-box">
                <div class="progress-dots" id="progressDots"></div>

                <div class="progress-label" id="progressLabel"></div>

                <button class="graph-button" id="openGraph">
                    Progress graph
                </button>
            </div>

        </div>

        <div class="box tasks">
            <h2>Tasks for today</h2>

            <div class="task-list" id="taskList"></div>

            <button class="primary add-task" id="openTaskModal">
                Add task
            </button>
        </div>

    </div>
</div>

<!-- ADD TASK -->
<div class="modal" id="taskModal">
    <div class="modal-content">
        <h2>Add task</h2>

        <form id="taskForm">
            <div class="form-group">
                <label for="taskName">Task</label>
                <input id="taskName" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="taskDeadline">Deadline</label>
                <input id="taskDeadline" type="datetime-local">
            </div>

            <div class="modal-buttons">
                <button type="button" id="cancelTask">Cancel</button>
                <button class="primary" type="submit">Add task</button>
            </div>
        </form>
    </div>
</div>

<!-- SESSION SETTINGS -->
<div class="modal" id="settingsModal">
    <div class="modal-content">
        <h2>Session settings</h2>

        <form id="settingsForm">
            <div class="settings-grid">
                <div class="form-group">
                    <label for="focusMinutes">Focus minutes</label>
                    <input id="focusMinutes" type="number" min="1" max="180" required>
                </div>

                <div class="form-group">
                    <label for="breakMinutes">Break minutes</label>
                    <input id="breakMinutes" type="number" min="1" max="60" required>
                </div>
            </div>

            <div class="modal-buttons">
                <button type="button" id="cancelSettings">Cancel</button>
                <button class="primary" type="submit">Save</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ---------------- SUPABASE ---------------- */

const SUPABASE_URL = "https://xyvvxpddvuhnyiagdeh.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_JWP2PqKxB-NuZiOW3B0hZA_odJdw1Ys";

const { createClient } = supabase;

const db = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;


/* ---------------- DATA ---------------- */

let data = {
    tasks: [],
    sessions: [],
    dailyTotals: {},
    settings: {
        focus: 25,
        break: 5
    }
};


/* ---------------- AUTH ---------------- */

let authMode = "login";

const authScreen = document.getElementById("authScreen");
const app = document.getElementById("app");
const authTitle = document.getElementById("authTitle");
const authSubmit = document.getElementById("authSubmit");
const toggleAuth = document.getElementById("toggleAuth");
const authMessage = document.getElementById("authMessage");


toggleAuth.addEventListener("click", () => {
    authMode = authMode === "login" ? "signup" : "login";

    if (authMode === "login") {
        authTitle.textContent = "Log in";
        authSubmit.textContent = "Log in";
        toggleAuth.textContent = "Create account";
    } else {
        authTitle.textContent = "Create account";
        authSubmit.textContent = "Create account";
        toggleAuth.textContent = "Back to login";
    }

    authMessage.textContent = "";
});


document.getElementById("authForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value;

    authSubmit.disabled = true;
    authMessage.textContent = "Please wait...";

    try {
        if (authMode === "login") {
            const { error } = await db.auth.signInWithPassword({
                email,
                password
            });

            if (error) throw error;

        } else {
            const { data: signUpData, error } = await db.auth.signUp({
                email,
                password
            });

            if (error) throw error;

            if (!signUpData.session) {
                authMessage.textContent =
                    "Account created. Check your email to confirm your account, then log in.";
            }
        }

    } catch (error) {
        authMessage.textContent = error.message;
    } finally {
        authSubmit.disabled = false;
    }
});


document.getElementById("logout").addEventListener("click", async () => {
    clearInterval(interval);

    await db.auth.signOut();

    currentUser = null;
    app.style.display = "none";
    authScreen.style.display = "flex";
    document.getElementById("authPassword").value = "";
    authMessage.textContent = "";
});


async function handleAuth() {

    const { data: sessionData } = await db.auth.getSession();

    if (sessionData.session) {
        await showApp(sessionData.session.user);
    } else {
        showLogin();
    }

    db.auth.onAuthStateChange(async (event, session) => {

        if (event === "SIGNED_IN" && session) {
            await showApp(session.user);
        }

        if (event === "SIGNED_OUT") {
            showLogin();
        }
    });
}


function showLogin() {
    currentUser = null;
    app.style.display = "none";
    authScreen.style.display = "flex";
}


async function showApp(user) {

    currentUser = user;

    authScreen.style.display = "none";
    app.style.display = "block";

    await loadCloudData();
}


/* ---------------- DATE ---------------- */

function getToday() {
    const d = new Date();

    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function formatDate(dateString) {

    const [year, month, day] =
        dateString.split("-").map(Number);

    return new Date(
        year,
        month - 1,
        day
    ).toLocaleDateString(
        undefined,
        {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
        }
    );
}


document.getElementById("currentDate").textContent =
    formatDate(getToday());


/* ---------------- CLOUD DATA ---------------- */

async function loadCloudData() {

    if (!currentUser) return;

    try {

        const [
            tasksResult,
            sessionsResult,
            totalsResult,
            settingsResult
        ] = await Promise.all([

            db.from("tasks")
                .select("*")
                .eq("user_id", currentUser.id),

            db.from("sessions")
                .select("*")
                .eq("user_id", currentUser.id)
                .order("completed_at", { ascending: true }),

            db.from("daily_totals")
                .select("*")
                .eq("user_id", currentUser.id),

            db.from("settings")
                .select("*")
                .eq("user_id", currentUser.id)
                .maybeSingle()
        ]);


        if (tasksResult.error) throw tasksResult.error;
        if (sessionsResult.error) throw sessionsResult.error;
        if (totalsResult.error) throw totalsResult.error;
        if (settingsResult.error) throw settingsResult.error;


        data.tasks = tasksResult.data.map(task => ({
            id: task.id,
            name: task.name,
            date: task.date,
            deadline: task.deadline,
            completed: task.completed,
            completedAt: task.completed_at
        }));


        data.sessions = sessionsResult.data.map(session => ({
            id: session.id,
            date: session.date,
            completedAt: session.completed_at,
            taskId: session.task_id,
            pauses: session.pauses,
            focusMinutes: session.focus_minutes
        }));


        data.dailyTotals = {};

        totalsResult.data.forEach(row => {
            data.dailyTotals[row.date] = row.total_minutes;
        });


        if (settingsResult.data) {

            data.settings.focus =
                settingsResult.data.focus_minutes;

            data.settings.break =
                settingsResult.data.break_minutes;

        } else {

            await db.from("settings").insert({
                user_id: currentUser.id,
                focus_minutes: 25,
                break_minutes: 5
            });
        }


        renderTasks();
        renderProgress();
        renderSessionInfo();

        clearInterval(interval);

        mode = "focus";
        running = false;
        remainingSeconds = data.settings.focus * 60;
        currentSessionPauses = 0;

        document.getElementById("mode").textContent = "Focus";
        document.getElementById("startPause").textContent = "Start";

        updateTimer();

    } catch (error) {

        alert("Could not load your cloud data: " + error.message);
    }
}


/* ---------------- TASKS ---------------- */

function renderTasks() {

    const list = document.getElementById("taskList");

    list.innerHTML = "";

    const todaysTasks =
        data.tasks.filter(task => task.date === getToday());

    if (todaysTasks.length === 0) {
        list.innerHTML =
            '<div class="empty">No tasks today.</div>';
        return;
    }


    todaysTasks.forEach(task => {

        const row = document.createElement("div");

        row.className =
            "task" +
            (task.completed ? " completed" : "");


        const name = document.createElement("div");

        name.className = "task-name";
        name.textContent = task.name;


        const deadline = document.createElement("div");

        deadline.className = "deadline";

        if (task.deadline) {

            const date = new Date(task.deadline);

            deadline.textContent =
                date.toLocaleTimeString(
                    [],
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );
        }


        const actions = document.createElement("div");

        actions.className = "task-actions";


        const complete = document.createElement("button");

        complete.className = "small-button";

        complete.textContent =
            task.completed ? "Undo" : "Done";

        complete.addEventListener("click", async () => {

            const newCompleted = !task.completed;

            const { error } =
                await db.from("tasks")
                    .update({
                        completed: newCompleted,
                        completed_at:
                            newCompleted
                                ? new Date().toISOString()
                                : null
                    })
                    .eq("id", task.id)
                    .eq("user_id", currentUser.id);

            if (error) {
                alert(error.message);
                return;
            }

            task.completed = newCompleted;
            task.completedAt =
                newCompleted
                    ? new Date().toISOString()
                    : null;

            renderTasks();
        });


        const pomo = document.createElement("button");

        pomo.className = "small-button";
        pomo.textContent = "T";
        pomo.title = "Use this task for Pomodoro";

        pomo.addEventListener("click", () => {

            selectedTask = task;

            document.getElementById("selectedTask").textContent =
                task.name;
        });


        const del = document.createElement("button");

        del.className = "small-button";
        del.textContent = "Delete";

        del.addEventListener("click", async () => {

            const { error } =
                await db.from("tasks")
                    .delete()
                    .eq("id", task.id)
                    .eq("user_id", currentUser.id);

            if (error) {
                alert(error.message);
                return;
            }

            data.tasks =
                data.tasks.filter(x => x.id !== task.id);

            if (
                selectedTask &&
                selectedTask.id === task.id
            ) {
                selectedTask = null;

                document.getElementById("selectedTask").textContent =
                    "No task selected";
            }

            renderTasks();
        });


        actions.append(
            complete,
            pomo,
            del
        );

        row.append(
            name,
            deadline,
            actions
        );

        list.appendChild(row);
    });
}


/* ---------------- ADD TASK ---------------- */

document.getElementById("openTaskModal").addEventListener(
    "click",
    () => {

        document.getElementById("taskModal").classList.add("open");

        document.getElementById("taskName").focus();
    }
);


document.getElementById("cancelTask").addEventListener(
    "click",
    () => {
        document.getElementById("taskModal").classList.remove("open");
    }
);


document.getElementById("taskForm").addEventListener(
    "submit",
    async (e) => {

        e.preventDefault();

        const name =
            document.getElementById("taskName").value.trim();

        const deadline =
            document.getElementById("taskDeadline").value;

        if (!name) return;


        const { data: insertedTask, error } =
            await db.from("tasks")
                .insert({
                    user_id: currentUser.id,
                    name,
                    date: getToday(),
                    deadline: deadline || null,
                    completed: false,
                    completed_at: null
                })
                .select()
                .single();


        if (error) {
            alert(error.message);
            return;
        }


        data.tasks.push({
            id: insertedTask.id,
            name: insertedTask.name,
            date: insertedTask.date,
            deadline: insertedTask.deadline,
            completed: insertedTask.completed,
            completedAt: insertedTask.completed_at
        });


        e.target.reset();

        document.getElementById("taskModal").classList.remove("open");

        renderTasks();
    }
);


/* ---------------- POMODORO ---------------- */

let mode = "focus";
let running = false;
let selectedTask = null;
let remainingSeconds = data.settings.focus * 60;
let interval = null;
let currentSessionPauses = 0;


function updateTimer() {

    const minutes =
        Math.floor(remainingSeconds / 60);

    const seconds =
        remainingSeconds % 60;

    document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0")
        + ":"
        + String(seconds).padStart(2, "0");
}


function startTimer() {

    if (running) return;

    running = true;

    document.getElementById("startPause").textContent =
        "Pause";

    interval = setInterval(() => {

        remainingSeconds--;

        updateTimer();

        if (remainingSeconds <= 0) {

            clearInterval(interval);

            running = false;

            document.getElementById("startPause").textContent =
                "Start";

            finishTimer();
        }

    }, 1000);
}


function pauseTimer() {

    if (!running) return;

    clearInterval(interval);

    running = false;

    currentSessionPauses++;

    document.getElementById("startPause").textContent =
        "Start";

    renderSessionInfo();
}


async function finishTimer() {

    if (mode === "focus") {

        const sessionMinutes =
            Number(data.settings.focus);

        const date = getToday();


        const { data: insertedSession, error: sessionError } =
            await db.from("sessions")
                .insert({
                    user_id: currentUser.id,
                    date,
                    completed_at: new Date().toISOString(),
                    task_id: selectedTask ? selectedTask.id : null,
                    pauses: currentSessionPauses,
                    focus_minutes: sessionMinutes
                })
                .select()
                .single();


        if (sessionError) {
            alert("Session could not be saved: " + sessionError.message);
            return;
        }


        const newTotal =
            (Number(data.dailyTotals[date]) || 0)
            + sessionMinutes;


        const { error: totalError } =
            await db.from("daily_totals")
                .upsert({
                    user_id: currentUser.id,
                    date,
                    total_minutes: newTotal
                });


        if (totalError) {
            alert("Progress could not be saved: " + totalError.message);
            return;
        }


        data.sessions.push({
            id: insertedSession.id,
            date,
            completedAt: insertedSession.completed_at,
            taskId: selectedTask ? selectedTask.id : null,
            pauses: currentSessionPauses,
            focusMinutes: sessionMinutes
        });

        data.dailyTotals[date] = newTotal;

        currentSessionPauses = 0;

        mode = "break";

        remainingSeconds =
            data.settings.break * 60;

        document.getElementById("mode").textContent =
            "Break";

        renderProgress();
        renderSessionInfo();

    } else {

        mode = "focus";

        remainingSeconds =
            data.settings.focus * 60;

        document.getElementById("mode").textContent =
            "Focus";
    }

    updateTimer();
}


document.getElementById("startPause").addEventListener(
    "click",
    () => {

        if (running) {
            pauseTimer();
        } else {
            startTimer();
        }
    }
);


document.getElementById("reset").addEventListener(
    "click",
    () => {

        clearInterval(interval);

        running = false;

        mode = "focus";

        remainingSeconds =
            data.settings.focus * 60;

        currentSessionPauses = 0;

        document.getElementById("mode").textContent =
            "Focus";

        document.getElementById("startPause").textContent =
            "Start";

        updateTimer();
        renderSessionInfo();
    }
);


/* ---------------- SESSION INFO ---------------- */

function renderSessionInfo() {

    const box = document.getElementById("sessionInfo");

    const sessions =
        data.sessions.filter(
            session => session.date === getToday()
        );

    if (sessions.length === 0) {

        box.innerHTML =
            "Today's completed sessions: 0";

        return;
    }

    box.innerHTML =
        `<div><strong>Today's completed sessions:</strong> ${sessions.length}</div>`
        +
        sessions.map(
            (session, index) =>
                `<div>Session ${index + 1} — ${session.pauses} pauses</div>`
        ).join("");
}


/* ---------------- SETTINGS ---------------- */

document.getElementById("openSettings").addEventListener(
    "click",
    () => {

        document.getElementById("focusMinutes").value =
            data.settings.focus;

        document.getElementById("breakMinutes").value =
            data.settings.break;

        document.getElementById("settingsModal").classList.add("open");
    }
);


document.getElementById("cancelSettings").addEventListener(
    "click",
    () => {
        document.getElementById("settingsModal").classList.remove("open");
    }
);


document.getElementById("settingsForm").addEventListener(
    "submit",
    async (e) => {

        e.preventDefault();

        const focus =
            Number(document.getElementById("focusMinutes").value);

        const breakTime =
            Number(document.getElementById("breakMinutes").value);

        if (
            !Number.isFinite(focus) ||
            !Number.isFinite(breakTime) ||
            focus < 1 ||
            breakTime < 1
        ) {
            return;
        }


        const { error } =
            await db.from("settings")
                .upsert({
                    user_id: currentUser.id,
                    focus_minutes: focus,
                    break_minutes: breakTime
                });


        if (error) {
            alert(error.message);
            return;
        }


        data.settings.focus = focus;
        data.settings.break = breakTime;

        clearInterval(interval);

        running = false;
        mode = "focus";

        remainingSeconds = focus * 60;

        document.getElementById("mode").textContent =
            "Focus";

        document.getElementById("startPause").textContent =
            "Start";

        document.getElementById("settingsModal").classList.remove("open");

        updateTimer();
        renderProgress();
    }
);


/* ---------------- 30 DAY PROGRESS ---------------- */

function dateAfter(dateString, numberOfDays) {

    const [year, month, day] =
        dateString.split("-").map(Number);

    const date =
        new Date(
            year,
            month - 1,
            day
        );

    date.setDate(date.getDate() + numberOfDays);

    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


function renderProgress() {

    const container =
        document.getElementById("progressDots");

    container.innerHTML = "";

    const startDate = getToday();


    for (let i = 0; i < 30; i++) {

        const date =
            dateAfter(startDate, i);

        const dot =
            document.createElement("div");

        dot.className = "dot";


        if (date > startDate) {

            dot.classList.add("future");

        } else {

            const totalMinutes =
                Number(data.dailyTotals[date]) || 0;


            if (totalMinutes >= 480) {
                dot.classList.add("green");
            } else {
                dot.classList.add("red");
            }
        }


        const totalMinutes =
            Number(data.dailyTotals[date]) || 0;

        const hours =
            Math.floor(totalMinutes / 60);

        const minutes =
            totalMinutes % 60;

        dot.title =
            `${date}: ${hours}h ${minutes}m`;

        container.appendChild(dot);
    }


    const todayMinutes =
        Number(data.dailyTotals[startDate]) || 0;

    const todayHours =
        Math.floor(todayMinutes / 60);

    const todayRemainingMinutes =
        todayMinutes % 60;

    document.getElementById("progressLabel").textContent =
        `Today: ${todayHours}h ${todayRemainingMinutes}m / 8h`;
}


/* ---------------- GRAPH ---------------- */

document.getElementById("openGraph").addEventListener(
    "click",
    () => {
        window.location.href = "graph.html";
    }
);


/* ---------------- START ---------------- */

handleAuth();

</script>

</body>
</html>
