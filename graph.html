<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress graph</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f7f7f7;
    color: #111;
    font-family: Arial, Helvetica, sans-serif;
}

.page {
    max-width: 1060px;
    margin: 0 auto;
    padding: 48px 24px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

h1 {
    margin: 0;
    font-size: 30px;
}

.back {
    border: 1px solid #aaa;
    background: white;
    border-radius: 7px;
    padding: 10px 18px;
    cursor: pointer;
    font-size: 15px;
}

.graph-box {
    background: white;
    border: 1px solid #c9c9c9;
    border-radius: 12px;
    padding: 30px;
}

.info {
    color: #666;
    font-size: 14px;
    margin-bottom: 25px;
}

.chart-wrapper {
    width: 100%;
    overflow-x: auto;
}

canvas {
    display: block;
}

.no-data {
    padding: 50px 0;
    color: #777;
}

@media (max-width: 600px) {

    .page {
        padding: 25px 15px;
    }

    .graph-box {
        padding: 18px;
    }

    .top {
        gap: 15px;
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="top">

        <h1>Progress</h1>

        <button
            class="back"
            id="back"
        >
            Back
        </button>

    </div>

    <div class="graph-box">

        <div class="info">
            Completed Pomodoro sessions by date
        </div>

        <div
            class="chart-wrapper"
            id="chartWrapper"
        ></div>

    </div>

</div>


<script>

const STORAGE_KEY = "todo_dashboard_v3";

const data =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY)
        || '{"sessions":[]}'
    );

const sessions =
    data.sessions || [];


/* ---------------- DATE HELPERS ---------------- */

function getDateString(date) {

    return date.toISOString().slice(0, 10);
}


function formatDate(dateString) {

    const [
        year,
        month,
        day
    ] = dateString.split("-").map(Number);

    return new Date(
        year,
        month - 1,
        day
    ).toLocaleDateString(
        undefined,
        {
            month: "short",
            day: "numeric"
        }
    );
}


/* ---------------- BUILD DATE DATA ---------------- */

/*
    Show every date from today backwards
    to the first recorded session.

    If there is no history yet, show today.
*/

const today =
    new Date();

today.setHours(
    0, 0, 0, 0
);


let firstDate = new Date(today);

if (sessions.length > 0) {

    sessions.forEach(session => {

        const parts =
            session.date
                .split("-")
                .map(Number);

        const date =
            new Date(
                parts[0],
                parts[1] - 1,
                parts[2]
            );

        if (date < firstDate) {
            firstDate = date;
        }
    });
}


const dates = [];

let cursor =
    new Date(firstDate);

while (cursor <= today) {

    dates.push(
        getDateString(cursor)
    );

    cursor.setDate(
        cursor.getDate() + 1
    );
}


/*
    Count sessions for each date.
*/

const values =
    dates.map(date => {

        return sessions.filter(
            session =>
                session.date === date
        ).length;

    });


/* ---------------- CHART ---------------- */

const wrapper =
    document.getElementById(
        "chartWrapper"
    );


if (
    sessions.length === 0
) {

    wrapper.innerHTML =
        '<div class="no-data">No completed sessions yet.</div>';

} else {

    const width =
        Math.max(
            700,
            dates.length * 70
        );

    const height = 430;

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = width;
    canvas.height = height;

    wrapper.appendChild(canvas);

    const ctx =
        canvas.getContext("2d");


    /* CHART AREA */

    const left = 60;
    const right = 30;
    const top = 30;
    const bottom = 65;

    const chartWidth =
        width - left - right;

    const chartHeight =
        height - top - bottom;


    const maxValue =
        Math.max(
            1,
            ...values
        );


    /*
        Grid lines
    */

    ctx.font =
        "13px Arial";

    ctx.textAlign =
        "right";

    ctx.textBaseline =
        "middle";

    for (
        let i = 0;
        i <= maxValue;
        i++
    ) {

        const y =
            top +
            chartHeight -
            (i / maxValue) *
            chartHeight;

        ctx.strokeStyle =
            "#e5e5e5";

        ctx.lineWidth = 1;

        ctx.beginPath();

        ctx.moveTo(
            left,
            y
        );

        ctx.lineTo(
            width - right,
            y
        );

        ctx.stroke();

        ctx.fillStyle =
            "#555";

        ctx.fillText(
            i,
            left - 10,
            y
        );
    }


    /*
        X axis
    */

    ctx.strokeStyle =
        "#111";

    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.moveTo(
        left,
        top + chartHeight
    );

    ctx.lineTo(
        width - right,
        top + chartHeight
    );

    ctx.stroke();


    /*
        Plot line
    */

    if (dates.length > 1) {

        ctx.beginPath();

        values.forEach(
            (value, index) => {

                const x =
                    left +
                    (
                        index /
                        (dates.length - 1)
                    ) *
                    chartWidth;

                const y =
                    top +
                    chartHeight -
                    (
                        value /
                        maxValue
                    ) *
                    chartHeight;

                if (index === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
        );

        ctx.strokeStyle =
            "#111";

        ctx.lineWidth = 2;

        ctx.stroke();
    }


    /*
        Points and labels
    */

    values.forEach(
        (value, index) => {

            const x =
                dates.length === 1
                    ? left + chartWidth / 2
                    : left +
                      (
                        index /
                        (dates.length - 1)
                      ) *
                      chartWidth;

            const y =
                top +
                chartHeight -
                (
                    value /
                    maxValue
                ) *
                chartHeight;


            /* point */

            ctx.fillStyle =
                "#111";

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                4,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /* date */

            ctx.save();

            ctx.translate(
                x,
                top + chartHeight + 18
            );

            ctx.rotate(
                -Math.PI / 4
            );

            ctx.textAlign =
                "right";

            ctx.textBaseline =
                "middle";

            ctx.fillStyle =
                "#555";

            ctx.font =
                "12px Arial";

            ctx.fillText(
                formatDate(dates[index]),
                0,
                0
            );

            ctx.restore();


            /* value */

            ctx.fillStyle =
                "#111";

            ctx.font =
                "13px Arial";

            ctx.textAlign =
                "center";

            ctx.fillText(
                value,
                x,
                y - 12
            );
        }
    );
}


/* ---------------- BACK ---------------- */

document.getElementById(
    "back"
).addEventListener(
    "click",
    () => {

        window.location.href =
            "index.html";
    }
);

</script>

</body>
</html>
